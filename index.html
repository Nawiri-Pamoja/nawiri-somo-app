<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#138a40">
<title>Nawiri Pamoja – Dholuo ↔ English</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--green:#138a40;--green-d:#0d6a30;--sun:#f79c34;--clay:#c9502c;--cream:#fff8ea;--ink:#2b2a26;--sky:#1175b9;--ok:#2e9e5b;--bad:#d64545;--line:#eadfc6;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif;font-size:18px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;touch-action:manipulation}
input{font:inherit;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;margin:6px 0}
small{display:block;font-weight:400;font-size:.68em;opacity:.75;line-height:1.2}
h2{margin:10px 0;font-size:24px}h2 small{font-size:.6em}h3{margin:20px 0 6px}.c{text-align:center}
header{background:var(--green);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px;line-height:1.1;flex:1}header .logo{width:42px;height:42px;border-radius:12px;background:#fff;padding:3px;flex:none}
#hstat{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;white-space:nowrap}.hav{font-size:28px;background:#fff;border-radius:50%;width:44px;height:44px}
main{max-width:760px;margin:0 auto;padding:14px 14px 96px}
body.full header,body.full #nav{display:none!important}body.full main{padding:0;max-width:none}
#nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);justify-content:space-around;z-index:5;padding:4px 0}
#nav button{flex:1;padding:4px;font-size:14px;font-weight:700;opacity:.55}#nav button.on{opacity:1;color:var(--green-d)}#nav span{display:block;font-size:28px}
#toast{display:none;position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#2b2a26;color:#fff;padding:10px 18px;border-radius:20px;z-index:30;max-width:90%;text-align:center}
.logo-lg{display:block;width:96px;height:96px;margin:6px auto}
.note{color:#6b665a;font-size:15px;margin:8px 0}.tag{display:inline-block;background:#fde7c7;color:#8a4b00;border-radius:10px;padding:2px 10px;font-size:14px;margin-top:6px}
.small-link{display:block;margin:22px auto 0;color:#6b665a;text-decoration:underline;font-size:15px;padding:10px}
.btn{background:var(--green);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;box-shadow:0 4px 0 var(--green-d);display:inline-block;text-align:center}
.btn.alt{background:#fff;color:var(--green-d);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}.btn.warn{background:var(--clay);box-shadow:0 4px 0 #8f3518}
.btn.sm{padding:8px 12px;font-size:16px}.btn.wide{display:block;width:100%;margin-top:14px}
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2,.row3{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;text-align:left}.scroll .chip,.stages button{white-space:nowrap}.chip.on{background:var(--green);border-color:var(--green);color:#fff}
/* who */
.avs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;margin:14px 0}
.av{background:#fff;border-radius:22px;padding:10px 4px;box-shadow:0 4px 0 var(--line);font-weight:700;min-height:112px}.av span{display:block;font-size:54px;line-height:1.15}.av.new{color:var(--green);border:3px dashed var(--line);box-shadow:none}
.village{text-align:center;background:#e4f4e9;border-radius:18px;padding:10px;font-size:20px}
.starts{display:grid;gap:12px;margin-top:12px}.starts button{background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line);display:grid;grid-template-columns:70px 1fr;text-align:left;align-items:center}
.starts span{font-size:50px;grid-row:1/3}.starts b{font-size:22px;color:var(--green-d)}
/* path */
.stages{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}.stages button{flex:none;width:70px;background:#fff;border-radius:18px;padding:6px 2px;border:3px solid var(--line);font-weight:700}
.stages span{font-size:30px;display:block}.stages .on{border-color:var(--sun);background:#fff3df}
.sthead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.day{font-size:20px;display:flex;align-items:center;gap:5px}.day i{width:16px;height:16px;border-radius:50%;background:var(--line);display:inline-block}.day i.on{background:var(--sun)}
.due{background:var(--sky);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;margin-left:8px}
.path{display:flex;flex-direction:column;gap:14px;padding:10px 0 30px}
.node{display:grid;grid-template-columns:84px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;width:min(100%,360px)}
.node{max-width:78%}.node.z1{margin-left:10%}.node.z2{margin-left:20%}.node.z3{margin-left:10%}
.ne{grid-row:1/3;width:84px;height:84px;border-radius:50%;background:#fff;border:5px solid var(--line);display:grid;place-items:center;font-size:42px;box-shadow:0 5px 0 var(--line)}
.ne.txt{font-size:26px;font-weight:800;color:var(--green-d)}.nl{font-weight:700;font-size:17px;line-height:1.15;align-self:end}.ns{font-size:15px;letter-spacing:1px;align-self:start;color:#c9bfa5}
.node.done .ne{border-color:var(--ok);background:#e4f4e9}.node.now .ne{border-color:var(--sun);animation:pulse 1.4s infinite}.node.lock{opacity:.45}.node.lock .ne{background:#eee4cc}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(247,156,52,.25)}}
/* lesson */
.sx{min-height:100vh;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:10px 14px 20px}
.sxtop{display:flex;align-items:center;gap:10px}.x{font-size:26px;width:44px;height:44px;color:#9b937f}.hint{font-size:22px;white-space:nowrap}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:10px;transition:width .3s}
.exb{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-top:10px}
.card{background:var(--card);border-radius:26px;padding:18px;text-align:center;box-shadow:0 5px 0 var(--line);position:relative;margin-top:8px}
.pic{font-size:64px;line-height:1.15}.pic.xl{font-size:clamp(96px,26vw,150px)}.pic.lg{font-size:84px}.pic.md{font-size:54px}.pic.txt{font-weight:800;color:var(--sky)}
.tt{font-size:clamp(28px,7vw,44px);font-weight:800;color:var(--green-d);line-height:1.15}.nt{font-size:clamp(20px,5vw,28px);font-weight:700;color:var(--clay)}.nt.big{font-size:clamp(26px,6.5vw,40px)}
.pen{position:absolute;right:10px;top:10px;font-size:22px;background:#fde7c7;border-radius:50%;width:42px;height:42px}
.spk{background:#e4f4e9;border-radius:18px;padding:8px 14px;font-size:26px;margin:6px 4px 0;font-weight:700}.spk.luo-b{background:#fbe3da}.spk.sm{padding:4px 10px;font-size:20px;margin:0 0 0 4px}
.spk2{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.bigspk{font-size:64px;background:#e4f4e9;border-radius:50%;width:130px;height:130px;box-shadow:0 5px 0 #bfe3cb}.bigspk.sm{font-size:38px;width:78px;height:78px}
.bigspk.rec{background:#fbe3da;box-shadow:0 5px 0 #efc4b4}.bigspk.rec.on{background:var(--bad);animation:pulse 1s infinite}.bigspk.mine{background:#dcecf8;box-shadow:0 5px 0 #b9d6ec}
.sayrow{display:flex;gap:16px;justify-content:center;margin-top:12px}
.go{display:block;margin:6px auto 0;background:var(--sun);color:#fff;font-size:34px;font-weight:800;border-radius:24px;padding:10px 0;width:min(100%,300px);box-shadow:0 6px 0 #c97a1c}
.go.alt{background:#fff;color:var(--sun);box-shadow:0 6px 0 var(--line);width:110px}.row2 .go{margin:0;width:170px}.skip{display:block;margin:0 auto;font-size:30px;color:#9b937f;padding:6px 30px}
.opts{display:grid;gap:12px}.opts.pics{grid-template-columns:1fr 1fr}.opts.n2.pics .pic{font-size:84px}
.opt{background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px 12px;font-size:clamp(19px,4.6vw,26px);font-weight:700;box-shadow:0 4px 0 var(--line);min-height:62px}
.opt.luo{color:var(--clay)}.opt.good{background:#d7f3e1;border-color:var(--ok)}.opt.bad{background:#fbdcdc;border-color:var(--bad)}.opt.sel{border-color:var(--sun);background:#fff3df}.opt.dim{opacity:.3}
.opt .lt{font-size:56px;color:var(--sky)}
.fb{text-align:center;font-size:22px;padding:10px;border-radius:16px}.fb.ok{background:#d7f3e1}.fb.no{background:#fbdcdc}
.slots{min-height:74px;background:#fff;border:3px dashed var(--line);border-radius:20px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.tile{background:#fff;border:3px solid var(--line);border-radius:14px;padding:10px 14px;font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--line)}
.sp .tile{min-width:54px;font-size:30px}.tile.used{visibility:hidden}.tile.on{border-color:var(--sky)}.ph{color:#c9bfa5;font-size:28px}.ans{font-size:28px;font-weight:800;color:var(--green-d)}
.shake{animation:shake .4s;border-color:var(--bad)!important}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}.match>div{display:grid;gap:12px}.match .opt{font-size:clamp(17px,4vw,22px)}
.glyph{font-size:clamp(110px,30vw,170px);font-weight:800;color:var(--sky);line-height:1}
.syls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}.syl{background:#dcecf8;border-radius:16px;padding:10px 12px;font-size:30px;font-weight:800;min-width:64px;box-shadow:0 4px 0 #b9d6ec}
.keyw{font-size:34px;font-weight:700;background:#fff3df;border-radius:18px;padding:8px 18px;margin-top:6px}.keyw b{color:var(--bad)}.novoice{font-size:16px;color:#9b937f;margin-top:8px}
.tr canvas{width:min(78vw,340px);height:min(78vw,340px);background:#fffdf6;border:3px dashed var(--line);border-radius:22px;touch-action:none}
.tin{font-size:30px;text-align:center;font-weight:700}
.res .stars{font-size:60px}.res .off{filter:grayscale(1);opacity:.25}.gain{font-size:30px;font-weight:800;color:var(--ok)}.plant{font-size:72px}
/* chat, story */
.chat{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}.b{display:flex;align-items:center;gap:8px;max-width:92%;text-align:left;font-size:22px;cursor:pointer}.b.app{align-self:flex-start}.b.me{align-self:flex-end;flex-direction:row-reverse}
.bt{padding:12px 16px;border-radius:20px;box-shadow:0 3px 0 rgba(0,0,0,.1);background:#fff}.b.me .bt{background:#d7f3e1}
.tt2{display:block;font-size:clamp(20px,5vw,26px);font-weight:800;color:var(--green-d)}.nt2{display:block;font-size:clamp(16px,4vw,21px);font-weight:600;color:var(--clay)}
.story{display:grid;gap:10px;margin-bottom:16px}.story button{background:#fff;border-radius:18px;padding:12px 16px;text-align:left;box-shadow:0 3px 0 var(--line)}
/* games */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.tile.used{visibility:hidden}
.grid .tile{background:#fff;border-radius:22px;padding:14px 8px;font-size:19px;min-height:130px;box-shadow:0 5px 0 var(--line);border:0}.grid .e{display:block;font-size:50px}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mc{aspect-ratio:1;background:var(--green);color:#fff;border-radius:18px;font-size:34px;font-weight:800;display:grid;place-items:center;text-align:center;padding:4px}
.mc.up{background:#fff;color:var(--ink);font-size:clamp(15px,4vw,22px);border:3px solid var(--line)}.mc.done{background:#d7f3e1}.mce{display:block;font-size:34px}
.duel{height:100vh;display:flex;flex-direction:column}.dside{flex:1;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center}.dside.flip{transform:rotate(180deg);background:#eef6fb}
.dside .opts{grid-template-columns:1fr 1fr}.dq{font-size:26px;color:var(--clay)}.dsc{font-size:22px;min-height:28px}.dmid{display:flex;justify-content:center;gap:30px;background:var(--line)}.dmid button{font-size:24px;padding:4px 20px}
/* lists */
.dr{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:8px 10px;margin-bottom:6px}.dp{font-size:28px;width:44px;text-align:center;flex:none}.dt{flex:1;min-width:0}.dt b{display:block}.dt i{font-style:normal;color:var(--clay);font-weight:600}.dt u{color:#b07a00;text-decoration:none;font-weight:800}
.stats{display:flex;justify-content:space-around;font-size:24px;margin-top:10px}.stats b{display:block;font-size:20px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:14px 0}.badges span{background:#fff;border-radius:16px;padding:8px 4px;text-align:center;font-size:32px;filter:grayscale(1);opacity:.35}.badges span.on{filter:none;opacity:1}.badges small{font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--cream);border-radius:24px 24px 0 0;padding:18px;width:min(100%,640px);max-height:92vh;overflow:auto}
.sheet label{font-size:14px;color:#6b665a;display:block;margin-top:8px}.recline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}.recline b{min-width:70px}.recline.c{justify-content:center;margin-top:14px}
@media(min-width:700px){html,body{font-size:20px}.opts:not(.pics){grid-template-columns:1fr 1fr}.mem{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

/* ---------- letter tracing ---------- */
function traceInit(ex) {
  const c = $('trc'), g = c.getContext('2d'), W = 320, txt = ex.g, fs = txt.length > 2 ? 150 : txt.length > 1 ? 190 : 250;
  const off = document.createElement('canvas'); off.width = off.height = W; const og = off.getContext('2d');
  og.font = `700 ${fs}px system-ui,sans-serif`; og.textAlign = 'center'; og.textBaseline = 'middle'; og.fillText(txt, W / 2, W / 2);
  const data = og.getImageData(0, 0, W, W).data, N = 20, cs = W / N, need = new Set(), hit = new Set();
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { let n = 0; for (let dy = 2; dy < cs; dy += 4) for (let dx = 2; dx < cs; dx += 4) if (data[(((y * cs + dy) | 0) * W + ((x * cs + dx) | 0)) * 4 + 3] > 100) n++; if (n >= 4) need.add(y * N + x); }
  g.fillStyle = '#e6dcc4'; g.font = og.font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, W / 2, W / 2);
  g.lineWidth = 22; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#138a40';
  let down = false, last = null, shown = false;
  const pos = e => { const r = c.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return [(t.clientX - r.left) * W / r.width, (t.clientY - r.top) * W / r.height]; };
  const mark = (x, y) => { const k = Math.floor(y / cs) * N + Math.floor(x / cs); if (need.has(k)) hit.add(k); };
  const check = () => { if (!shown && hit.size >= need.size * .6) { shown = true; beep(true); $('trgo').innerHTML = nextBtn('exDone(true,false)', '✓'); } };
  const start = e => { e.preventDefault(); down = true; last = pos(e); mark(last[0], last[1]); };
  const move = e => { if (!down) return; e.preventDefault(); const p = pos(e); g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke();
    for (let t = 0; t <= 1; t += .25) mark(last[0] + (p[0] - last[0]) * t, last[1] + (p[1] - last[1]) * t); last = p; check(); };
  const end = () => { down = false; check(); };
  c.addEventListener('pointerdown', start); c.addEventListener('pointermove', move); c.addEventListener('pointerup', end); c.addEventListener('pointerleave', end);
  setTimeout(() => { if (!shown && $('trgo') && view === 'ses' && cur() === ex) $('trgo').innerHTML = `<button class="skip" onclick="exDone(true,false)">›</button>`; }, 6000);
}

   <h3>Settings</h3><div class="chips">${tg('openAll', 'All lessons open')}${tg('sw', 'Read Dholuo with the Swahili voice until recorded')}</div>
   <p class="note">English voice: <b>${V.en ? esc(V.en.name) : hasTTS() ? 'default' : 'none'}</b> · Swahili voice: <b>${V.sw ? esc(V.sw.name) : 'not found'}</b>
     <button class="chip" onclick="tts('Good morning. How are you?','en')">▶ test English</button><button class="chip" onclick="tts('Oyawore. Idhi nade?','sw').then(ok=>ok||toast('No Swahili voice'))">▶ test Dholuo</button></p>
   <h3>Learners</h3>${S.profiles.map(p => `<div class="dr"><span class="dp">${p.av}</span><span class="dt"><b>${esc(p.name || '–')}</b><i>${p.seeds || 0} 🌱 · ${Object.keys(p.stars).length} lessons · ${mastered(p)} words · ${p.dir === 'en' ? 'learns English' : 'learns Dholuo'}</i></span><button class="spk sm" onclick="delP('${p.id}')">🗑</button></div>`).join('') || '<p class="note">none yet</p>'}
   ${deferredInstall ? `<button class="btn wide" onclick="installApp()">📲 Install on this tablet</button>` : ''}
   <button class="btn alt wide" onclick="helper=false;go(P()?'home':'who')">Leave helper mode</button>`;
};
function delP(id) { const p = S.profiles.find(x => x.id === id); if (!p || !confirm('Delete ' + p.av + ' ' + (p.name || '') + ' and all progress?')) return; S.profiles = S.profiles.filter(x => x.id !== id); if (S.cur === id) S.cur = null; save(); render(); }
const SCOPES = [['uns', 'Not sure first'], ['w', 'Words'], ['p', 'Phrases'], ['s', 'Sentences'], ['syl', 'Sounds']];
function scopeList(sc) { return sc === 'uns' ? checkable().filter(it => !S.edits[it.id]).sort((a, b) => (a.sure ? 1 : 0) - (b.sure ? 1 : 0)) : (KIND[sc] || []).filter(it => it.luo || S.edits[it.id]); }
VIEWS.check = app => {
  const sc = ctx.sc || 'uns'; if (!ctx.list) { ctx.list = scopeList(sc).filter(it => sc === 'uns' || !S.edits[it.id]); ctx.i = 0; }
  const chips = `<div class="chips">${SCOPES.slice(0, 4).map(s => `<button class="chip ${sc === s[0] ? 'on' : ''}" onclick="go('check',{sc:'${s[0]}'})">${s[1]}</button>`).join('')}</div>`;
  if (ctx.i >= ctx.list.length) { app.innerHTML = chips + `<div class="card"><div class="pic lg">🎉</div><div class="tt">All checked here.</div><button class="btn" onclick="go('helper')">Back</button></div>`; return; }
  const it = ctx.list[ctx.i];
  app.innerHTML = chips + `<p class="note">${ctx.i + 1} / ${ctx.list.length} · Is the Dholuo right and natural?</p>
    <div class="card"><div class="pic lg">${esc(it.pic)}</div><div class="tt">${esc(it.en)}</div><div class="nt big">${esc(luoOf(it))}</div>${it.sure ? '' : '<div class="tag">author was not sure</div>'}
    ${canEn(it) ? `<button class="spk" onclick="spk++;sayEn(I('${it.id}'))">🔊</button>` : ''}</div>
    <div class="row3"><button class="btn" onclick="confirmIt('${it.id}')">✓ Correct</button><button class="btn warn" onclick="openEdit('${it.id}')">✎ Fix it</button><button class="btn alt" onclick="ctx.i++;render()">Skip ›</button></div>
    <button class="small-link" onclick="go('helper')">‹ Helpers</button>`;
};
function confirmIt(id) { S.edits[id] = {luo: luoOf(I(id)), status: 'confirmed', note: (S.edits[id] || {}).note || ''}; save(); if (view === 'check') ctx.i++; render(); }
let curEditId = null;
function closeModal() { cancelRec(); curEditId = null; const m = $('modal'); if (m) m.remove(); }
function openEdit(id) {
  const it = I(id); if (!it) return; closeModal(); curEditId = id; const e = S.edits[id] || {};
  const d = document.createElement('div'); d.id = 'modal'; d.className = 'modal';
  d.innerHTML = `<div class="sheet"><h3>${esc(it.pic)} ${esc(it.en)}</h3><label>Dholuo</label><input id="eluo" value="${esc(luoOf(it))}">
    <label>Note (other word, dialect, how to say it …)</label><input id="enote" value="${esc(e.note || '')}"><div id="recbox">${recBox(id)}</div>
    <div class="row3"><button class="btn" onclick="saveEdit()">Save</button><button class="btn alt" onclick="closeModal()">Cancel</button></div></div>`;
  document.body.appendChild(d);
}
function saveEdit() {
  const it = I(curEditId), v = $('eluo').value.trim(), note = $('enote').value.trim(); if (!v) return toast('Please write the Dholuo');
  S.edits[it.id] = {luo: v, status: v === it.luo ? 'confirmed' : 'corrected', note}; save(); closeModal(); toast('Saved ✓'); if (view === 'check') ctx.i++; render();
}
function openAdd() {
  closeModal(); const d = document.createElement('div'); d.id = 'modal'; d.className = 'modal';
  d.innerHTML = `<div class="sheet"><h3>＋ Our own word</h3><label>English</label><input id="aen"><label>Dholuo</label><input id="aluo"><label>Picture (one emoji, not needed)</label><input id="apic" maxlength="4">
    <div class="row3"><button class="btn" onclick="saveAdd()">Save</button><button class="btn alt" onclick="closeModal()">Cancel</button></div></div>`;
  document.body.appendChild(d);
}
function saveAdd() { const en = $('aen').value.trim(), luo = $('aluo').value.trim(), pic = $('apic').value.trim(); if (!en || !luo) return toast('English and Dholuo, please');
  S.added.push({en, luo, pic}); save(); loadAdded(); closeModal(); toast('Added ⭐'); render(); }
function dl(name, text) { const file = new File([text], name, {type: 'text/plain'});
  if (navigator.canShare && navigator.canShare({files: [file]})) { navigator.share({files: [file], title: name}).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Saved in Downloads: ' + name); }
function exportEdits() { dl('dholuo-corrections-' + new Date().toISOString().slice(0, 10) + '.txt', JSON.stringify({app: 'nawiri-pamoja-edits', v: 2, at: new Date().toISOString(), edits: S.edits, added: S.added})); }
async function importEdits(f) { if (!f) return; try { const d = JSON.parse(await f.text()); if (!d || d.app !== 'nawiri-pamoja-edits') throw 0; let n = 0;
  Object.keys(d.edits || {}).forEach(k => { const e = d.edits[k]; if (ITEMS[k] && e && typeof e.luo === 'string' && e.luo.length < 300) { S.edits[k] = {luo: e.luo, status: e.status === 'corrected' ? 'corrected' : 'confirmed', note: String(e.note || '').slice(0, 300)}; n++; } });
  (d.added || []).forEach(w => { if (w && typeof w.en === 'string' && typeof w.luo === 'string' && !S.added.some(x => x.en === w.en)) { S.added.push({en: w.en.slice(0, 80), luo: w.luo.slice(0, 80), pic: String(w.pic || '').slice(0, 4)}); n++; } });
  save(); loadAdded(); toast('Imported ' + n + ' entries ✓'); render(); } catch (e) { toast('This file does not look like exported corrections'); } }

/* ---------- recording (helpers) ---------- */
let rec = null;
async function startRec(id, lang) {
  cancelRec(); stopSound();
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder)) { toast('Recording is not available here'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    const mr = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream), chunks = [];
    const r = {mr, stream, id, lang, state: 'recording', blob: null, timer: null, discard: false, fromQueue: view === 'recorder' && !$('modal')};
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); clearTimeout(r.timer); if (r.discard || rec !== r) return;
      r.blob = new Blob(chunks, {type: mr.mimeType || mime || 'audio/webm'}); r.state = 'pending'; refreshRec(); playBlob(r.blob); };
    r.timer = setTimeout(() => { if (mr.state === 'recording') mr.stop(); }, 15000); rec = r; mr.start(); refreshRec();
  } catch (e) { toast('Please allow the microphone'); }
}
function stopRec() { if (rec && rec.mr.state === 'recording') rec.mr.stop(); }
function cancelRec() { if (!rec) return; rec.discard = true; clearTimeout(rec.timer); try { if (rec.mr.state === 'recording') rec.mr.stop(); } catch (e) {} try { rec.stream.getTracks().forEach(t => t.stop()); } catch (e) {} rec = null; }
async function keepRec() {
  if (!rec || !rec.blob) return; const {id, lang, blob, fromQueue} = rec;
  try { await DB.put(id + '|' + lang, {blob, mime: blob.type, ts: Date.now()}); haveLocal.add(id + '|' + lang); rec = null; toast('Saved 🎙️ ✓'); if (fromQueue && view === 'recorder') { ctx.i++; render(); } else refreshRec(); }
  catch (e) { toast('Could not save the recording'); }
}
async function delAudio(id, lang) { try { await DB.del(id + '|' + lang); } catch (e) {} haveLocal.delete(id + '|' + lang); refreshRec(); if (view === 'recorder' || view === 'helper') render(); }
function recRow(id, lang) {
  const st = rec && rec.id === id && rec.lang === lang ? rec.state : 'idle', has = hasAudio(id, lang);
  if (st === 'recording') return `<button class="btn warn sm" onclick="stopRec()">■ Stop</button><span class="note">recording…</span>`;
  if (st === 'pending') return `<button class="btn sm alt" onclick="playBlob(rec.blob)">▶ Listen</button><button class="btn sm" onclick="keepRec()">✓ Keep</button><button class="btn sm alt" onclick="startRec('${id}','${lang}')">↻ Again</button>`;
  return `<button class="btn sm" onclick="startRec('${id}','${lang}')">● ${has ? 'Record again' : 'Record'}</button>` + (has ? `<button class="btn sm alt" onclick="playAudio('${id}','${lang}')">▶</button>` : '') +
    (haveLocal.has(id + '|' + lang) ? `<button class="btn sm alt" onclick="delAudio('${id}','${lang}')">🗑</button>` : '');
}
function recBox(id) { return ['luo', 'en'].filter(l => l === 'luo' || I(id).en).map(l => `<div class="recline"><b>${l === 'luo' ? 'Dholuo' : 'English'}</b>${recRow(id, l)}</div>`).join(''); }
function refreshRec() { const b = $('recbox'); if (b && curEditId) b.innerHTML = recBox(curEditId); if (view === 'recorder' && !$('modal')) render(); }
VIEWS.recorder = app => {
  const lang = ctx.lang || 'luo', sc = ctx.sc || 'syl'; ctx.lang = lang; ctx.sc = sc;
  if (!ctx.list) { ctx.list = (KIND[sc] || []).filter(it => (lang === 'luo' ? luoOf(it) : it.en) && !hasAudio(it.id, lang)); ctx.i = 0; }
  const L = ctx.list, chips = `<div class="chips">${SCOPES.slice(1).map(s => `<button class="chip ${sc === s[0] ? 'on' : ''}" onclick="go('recorder',{sc:'${s[0]}',lang:'${lang}'})">${s[1]}</button>`).join('')}</div>
    <div class="chips"><button class="chip ${lang === 'luo' ? 'on' : ''}" onclick="go('recorder',{sc:'${sc}',lang:'luo'})">Dholuo</button><button class="chip ${lang === 'en' ? 'on' : ''}" onclick="go('recorder',{sc:'${sc}',lang:'en'})">English</button></div>`;
  if (ctx.i >= L.length) { app.innerHTML = chips + `<div class="card"><div class="pic lg">🎉</div><div class="tt">${L.length ? 'All recorded!' : 'Everything here has a voice already.'}</div><button class="btn" onclick="go('helper')">Back to helpers</button></div>`; return; }
  const it = L[ctx.i];
  app.innerHTML = chips + `<p class="note">${ctx.i + 1} / ${L.length} · Say it clearly, once, not too fast. ${sc === 'syl' ? 'Sounds are the most important: children learn to read with them.' : 'Wrong text? Tap ✎.'}</p>
    <div class="card">${sc === 'syl' ? '' : `<button class="pen" onclick="openEdit('${it.id}')">✎</button>`}<div class="pic lg ${sc === 'syl' ? 'txt' : ''}">${esc(it.pic)}</div><div class="tt">${esc(it.en)}</div><div class="nt big">${esc(luoOf(it))}</div></div>
    <div class="recline c">${recRow(it.id, lang)}<button class="btn sm alt" onclick="cancelRec();ctx.i++;render()">Skip ›</button></div><button class="small-link" onclick="go('helper')">‹ Helpers</button>`;
};
const b64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function exportAudio() {
  try { const ks = await DB.keys(); if (!ks.length) { toast('No recordings yet'); return; } const audio = {};
    for (const k of ks) { const r = await DB.get(k); if (r && r.blob) audio[k] = {mime: r.mime, ts: r.ts, data: await b64(r.blob)}; }
    dl('dholuo-voices-' + new Date().toISOString().slice(0, 10) + '.txt', JSON.stringify({app: 'nawiri-pamoja-audio', v: 1, at: new Date().toISOString(), audio}));
  } catch (e) { toast('Export failed'); }
}
async function importAudio(f) {
  if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d || d.app !== 'nawiri-pamoja-audio' || typeof d.audio !== 'object') throw new Error('bad'); let n = 0;
    for (const [k, v] of Object.entries(d.audio)) {
      if (!/^[a-z0-9_-]+\|(luo|en)$/.test(k) || !v || typeof v.data !== 'string' || !/^audio\/[a-z0-9.+-]+(;.*)?$/i.test(v.mime || '') || v.data.length > 3e6) continue;
      const old = haveLocal.has(k) ? await DB.get(k) : null; if (old && (old.ts || 0) >= (v.ts || 0)) continue;
      const bin = atob(v.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      await DB.put(k, {blob: new Blob([u], {type: v.mime}), mime: v.mime, ts: v.ts || Date.now()}); haveLocal.add(k); n++;
    }
    toast('Imported ' + n + ' recordings ✓'); render();
  } catch (e) { toast('This file does not look like exported voices'); }
}

/* ================= START ================= */
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (view === 'helper') render(); });
function installApp() { if (!deferredInstall) return; deferredInstall.prompt(); deferredInstall = null; render(); }
(async function init() {
  $('hlogo').src = LOGO; try { const l = document.createElement('link'); l.rel = 'icon'; l.href = LOGO; document.head.appendChild(l); } catch (e) {}
  view = S.profiles.length === 1 && P() ? 'home' : 'who'; render();
  try { (await DB.keys()).forEach(k => haveLocal.add(k)); } catch (e) {}
  try { if (/^https?:/.test(location.protocol)) { const r = await fetch('audio/manifest.json'); if (r.ok) { const m = await r.json(); hosted = {luo: m.luo || {}, en: m.en || {}}; } } } catch (e) {}
  try { if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js'); } catch (e) {}
  setTimeout(() => { initVoices(); if (view !== 'ses') render(); }, 800);
})();

</script>
